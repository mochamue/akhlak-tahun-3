<!DOCTYPE html>
<html lang="ms"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memancing Ikan – Akhlak Tahun 1</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#d9f1ff;--card:#fff;--tx:#1f2d3a;--pri:#0288d1;--acc:#ff8a00;--ok:#2e9d4f;--bad:#e53935;--bd:#b5dcf2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10263a;--card:#1d3a52;--tx:#f2f2f2;--bd:#3b6a8c}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;min-height:100vh}
.w{max-width:480px;margin:0 auto;padding:12px}
.ar{font-family:"Noto Naskh Arabic","Traditional Arabic",serif;direction:rtl}
.card{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:10px;text-align:center}
h1{font-size:22px;margin:6px 0}
.top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:var(--pri);width:0;transition:width .3s}
.big{font-size:64px;line-height:1.2}
.q{font-size:20px;font-weight:700}
.pond{background:linear-gradient(#4fc3f7,#0277bd);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.fish{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.92);color:#123;border:3px solid #fff;border-radius:40px;padding:12px 16px;font-size:20px;font-weight:700;cursor:pointer;animation:bob 2.4s ease-in-out infinite;text-align:left}
.fish:nth-child(2){animation-delay:.5s}.fish:nth-child(3){animation-delay:1s}
.fish span.e{font-size:34px}
@keyframes bob{50%{transform:translateY(-6px) translateX(6px)}}
.fish.catch{background:#b9f6ca;animation:cat 1.1s forwards}
@keyframes cat{40%{transform:translateY(-40px) rotate(-8deg) scale(1.08)}100%{transform:translateY(-40px) scale(1.05)}}
.fish.no{background:#ffcdd2;animation:none}.fish.rev{background:#b9f6ca;animation:none;border-color:var(--ok)}
.fish.away{transform:translateX(130%);opacity:0;transition:.8s;pointer-events:none;animation:none}
.pw{display:flex;gap:6px;margin-top:12px}
.pw button{flex:1;padding:8px 2px;border-radius:12px;border:2px solid var(--acc);background:var(--card);color:var(--tx);font-size:12px;cursor:pointer}
.pw button:disabled{opacity:.35}
.btn{display:block;text-align:center;text-decoration:none;background:var(--pri);color:#fff;border:0;border-radius:14px;padding:14px;font-size:18px;font-weight:700;width:100%;cursor:pointer;margin-top:8px}
.btn.wa{background:#25d366}.btn.g{background:var(--acc)}
input{width:100%;padding:12px;border-radius:12px;border:2px solid var(--bd);font-size:16px;background:var(--card);color:var(--tx)}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--acc);color:#fff;padding:10px 16px;border-radius:20px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:9;text-align:center}
#toast.s{opacity:1}
#fx{position:fixed;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:120px;opacity:0;z-index:8}
#fx.s{animation:pop 1s}
@keyframes pop{0%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:translateY(60px)}}
.shake{animation:sh .5s}
@keyframes sh{20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.red{animation:rd .6s}@keyframes rd{30%{background:#ef9a9a}}
.hide{display:none}.sc{font-size:54px;font-weight:800;color:var(--pri)}
</style></head><body>
<div id="toast"></div><div id="fx"></div>
<div class="w" id="app">
<div id="s0">
 <div class="card"><div class="big">🎣🐟</div><h1>Memancing Ikan</h1><div class="ar" style="font-size:24px">ادب قضاء حاجت</div><div>Akhlak Tahun 1 • 10 Soalan</div></div>
 <div class="card" style="text-align:left;font-size:14px">🐟 Tekan <b>ikan</b> yang ada jawapan betul untuk memancingnya!<br>✅ Betul +10 markah<br>🥾 Salah −5 markah (dapat kasut buruk 😢)<br>🔥 3 betul berturut-turut = Power-up percuma!</div>
 <input id="nm" placeholder="Nama anda" maxlength="30">
 <button class="btn" id="go">🎣 Mula Memancing</button>
</div>
<div id="s1" class="hide">
 <div class="top"><span id="qn">1/10</span><span id="st">🔥0</span><span id="bk">🪣 0</span><span id="sc">⭐ 0</span></div>
 <div class="bar"><i id="pb"></i></div>
 <div class="card"><div class="big" id="qe"></div><div class="q" id="qt"></div></div>
 <div class="pond" id="op"></div>
 <div class="pw" id="pw"></div>
</div>
<div id="s2" class="hide">
 <div class="card"><div style="font-size:60px" id="em"></div><div class="sc" id="fs"></div><div id="fd"></div></div>
 <a class="btn wa" id="wa" target="_blank" rel="noopener noreferrer">📤 Hantar Markah ke WhatsApp</a>
 <button class="btn" id="sh" style="background:#128c7e">📲 Kongsi (pilih WhatsApp)</button>
 <button class="btn g" id="cp">📋 Salin Markah</button>
 <button class="btn" id="re">🔁 Main Semula</button>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const D=[
["🚽","Kita masuk tandas dengan kaki yang mana dahulu?","Kaki kiri","Kaki kanan","Melompat"],
["🚪","Kita keluar tandas dengan kaki yang mana dahulu?","Kaki kanan","Kaki kiri","Berlari"],
["🤲","Apa yang kita baca sebelum masuk tandas?","Doa masuk tandas","Doa makan","Doa tidur"],
["🩴","Apa yang kita pakai di kaki ketika ke tandas?","Selipar","Kasut bola","Stoking"],
["🧕","Sebelum masuk tandas, kita perlu...","Menutup kepala","Membuka baju","Menyanyi"],
["🙊","Apa yang tidak boleh dibuat di dalam tandas?","Bercakap-cakap","Berdiam diri","Membaca doa"],
["✋","Kita beristinjak dengan tangan yang mana?","Tangan kiri","Tangan kanan","Kedua-dua tangan"],
["🧼","Selepas ke tandas, badan kita menjadi...","Bersih dan suci","Kotor","Busuk"],
["🙏","Apa yang kita baca selepas keluar tandas?","Doa keluar tandas","Doa masuk tandas","Doa makan"],
["😇","Allah suka orang yang...","Bersih","Kotor","Malas"]];
const FS=['🐟','🐠','🐡'];
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>sh(a).slice(0,n);
let AC;function snd(s,t='sine',v=.15){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();let x=AC.currentTime;s.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.setValueAtTime(f,x);g.gain.setValueAtTime(v,x);g.gain.exponentialRampToValueAtTime(.001,x+d);o.connect(g);g.connect(AC.destination);o.start(x);o.stop(x+d);x+=d*.8})}catch(e){}}
const sOK=()=>snd([[500,.08],[800,.1],[1100,.2]]),sNO=()=>snd([[300,.2],[220,.25],[150,.4]],'sawtooth',.12),sPW=()=>snd([[523,.1],[659,.1],[784,.1],[1047,.25]],'triangle'),sEnd=()=>snd([[523,.15],[659,.15],[784,.15],[659,.15],[784,.15],[1047,.4]],'triangle'),sTap=()=>snd([[500,.06]],'square',.05);
let Q,i,score,streak,right,P,locked,dbl,shield,name;
function show(n){['s0','s1','s2'].forEach(x=>$(x).classList.toggle('hide',x!=='s'+n))}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('s');setTimeout(()=>t.classList.remove('s'),1500)}
function fx(e){const f=$('fx');f.textContent=e;f.classList.remove('s');void f.offsetWidth;f.classList.add('s')}
function start(){name=$('nm').value.trim()||'Pemain';try{localStorage.setItem('jn',name)}catch(e){}
 Q=sh(D);i=0;score=0;streak=0;right=0;dbl=false;shield=false;P={f:1,s:0,h:0,d:0};show(1);render()}
function stats(){$('sc').textContent=`⭐ ${score}`;$('st').textContent=`🔥${streak}`;$('bk').textContent=`🪣 ${right}`}
function pwUI(){$('pw').innerHTML='';[['f','🔍','Halau ikan'],['s','⏭️','Langkau'],['h','🛡️','Jaring'],['d','🎣','Umpan x2']].forEach(([k,e,l])=>{const b=document.createElement('button');b.innerHTML=`${e} ${l}<br><b>${k==='h'&&shield?'AKTIF':k==='d'&&dbl?'AKTIF':P[k]}</b>`;b.disabled=!P[k]||locked||(k==='d'&&dbl)||(k==='h'&&shield);b.onclick=()=>usePw(k);$('pw').appendChild(b)})}
function render(){locked=false;const q=Q[i];
 $('qn').textContent=`${i+1}/10`;$('pb').style.width=(i/10*100)+'%';$('qe').textContent=q[0];$('qt').textContent=q[1];stats();
 const o=$('op');o.innerHTML='';
 sh([[q[2],1],[q[3],0],[q[4],0]]).forEach(([t,ok],k)=>{const e=document.createElement('button');e.className='fish';e._ok=ok;e.innerHTML=`<span class="e">${FS[k]}</span><span>${t}</span>`;e.onclick=()=>ans(e);o.appendChild(e)});
 pwUI()}
function ans(e){if(locked)return;locked=true;
 if(e._ok){e.classList.add('catch');right++;streak++;const g=dbl?20:10;score+=g;sOK();toast(`+${g} 🎉 Dapat ikan!`);fx('🎣');
  if(streak%3===0){const k=pick(['f','s','h','d'],1)[0];P[k]++;setTimeout(()=>{sPW();toast('🔥 Ganjaran Power-up!')},800)}}
 else{e.classList.add('no');e.querySelector('.e').textContent='🥾';[...$('op').children].forEach(x=>x._ok&&x.classList.add('rev'));
  streak=0;sNO();fx('😢');$('app').classList.add('shake');document.body.classList.add('red');setTimeout(()=>{$('app').classList.remove('shake');document.body.classList.remove('red')},700);
  if(shield){shield=false;toast('🛡️ Jaring melindungi markah!')}else{score=Math.max(0,score-5);toast('−5 markah 🥾 Kasut buruk!')}}
 dbl=false;stats();pwUI();setTimeout(()=>{i++;i>=10?end():render()},1500)}
function usePw(k){if(locked||!P[k])return;
 if(k==='f'){const w=[...$('op').children].filter(e=>!e._ok&&!e.classList.contains('away'));if(!w.length)return;w[0].classList.add('away');toast('🔍 Satu ikan salah berenang pergi!')}
 if(k==='s'){P.s--;sPW();toast('⏭️ Dilangkau');locked=true;return setTimeout(()=>{i++;i>=10?end():render()},600)}
 if(k==='h'){shield=true;toast('🛡️ Jaring aktif!')}if(k==='d'){dbl=true;toast('🎣 Umpan emas! Markah x2')}
 P[k]--;sPW();pwUI()}
function msg(){return `🎣 Memancing Ikan – Adab ke Tandas (Akhlak Tahun 1)\n👤 Nama: ${name}\n⭐ Markah: ${score}\n🐟 Ikan dapat: ${right}/10\n${right>=9?'🏆 Cemerlang!':right>=7?'👍 Bagus!':right>=5?'🙂 Boleh tahan':'💪 Perlu lebih latihan'}`}
function end(){show(2);sEnd();$('em').textContent=right>=9?'🏆':right>=7?'🎉':right>=5?'🙂':'💪';$('fs').textContent=`${score} markah`;$('fd').textContent=`🐟 ${right}/10 ikan dipancing`;fx('🎊');$('wa').href='https://api.whatsapp.com/send?text='+encodeURIComponent(msg())}
$('go').onclick=()=>{sTap();start()};$('re').onclick=()=>{sTap();start()};
$('sh').onclick=async()=>{try{if(navigator.share)await navigator.share({text:msg()});else throw 0}catch(e){try{await navigator.clipboard.writeText(msg());toast('Disalin – tampal di WhatsApp')}catch(_){prompt('Salin markah:',msg())}}};
$('cp').onclick=async()=>{try{await navigator.clipboard.writeText(msg());toast('Disalin ✅')}catch(e){prompt('Salin markah:',msg())}};
try{$('nm').value=localStorage.getItem('jn')||''}catch(e){}
</script></body></html>
